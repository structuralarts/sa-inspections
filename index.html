<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SA Inspections</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --paper:#F1F1EF; --surface:#FFFFFF; --surface-2:#F7F7F6; --ink:#1C1D20; --muted:#62666C; --line:#D9DAD7;
  --brand:#8E1B1B; --brand-hover:#771515; --brand-soft:#F5E6E5; --on-brand:#FFFFFF; --steel:#3A3D42;
  --ok:#1E8E44; --minor:#C08C00; --moderate:#D06008; --major:#B3261E; --na:#7A7D82;
  --logo-filter:none; color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141517; --surface:#1E1F22; --surface-2:#25272A; --ink:#ECECEA; --muted:#9EA1A7; --line:#35373B;
  --brand:#D4473F; --brand-hover:#E25A52; --brand-soft:#3A1F1E; --on-brand:#FFFFFF; --steel:#C9CBCE;
  --ok:#3DBA68; --minor:#E3B12C; --moderate:#F08A3A; --major:#EF5B52; --na:#9A9DA2; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#141517; --surface:#1E1F22; --surface-2:#25272A; --ink:#ECECEA; --muted:#9EA1A7; --line:#35373B;
  --brand:#D4473F; --brand-hover:#E25A52; --brand-soft:#3A1F1E; --on-brand:#FFFFFF; --steel:#C9CBCE;
  --ok:#3DBA68; --minor:#E3B12C; --moderate:#F08A3A; --major:#EF5B52; --na:#9A9DA2; color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:400 17px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;font-weight:600;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:2px}
img{max-width:100%;display:block}
.hidden{display:none!important}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px clamp(14px,3vw,28px);min-height:64px}
.bar .logo{height:34px;width:auto}
.logo-chip{background:#fff;border-radius:8px;padding:4px 8px;display:inline-flex}
.bar .title{flex:1;min-width:0}
.bar .title h1{font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .title p{margin:0;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:16px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--major)}
.btn.sm{min-height:36px;padding:0 12px;font-size:15px}
.btn svg{width:20px;height:20px;flex:none}
.icon-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.icon-btn.rec{background:var(--brand);border-color:var(--brand);color:var(--on-brand);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--brand) 25%,transparent)}}
@media (prefers-reduced-motion:reduce){.icon-btn.rec{animation:none}}

/* home */
.wrap{max-width:1100px;margin:0 auto;padding:clamp(16px,3vw,32px)}
.start{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin:6px 0 34px}
.type-tile{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:18px 18px 18px 22px;min-height:132px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.type-tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--brand)}
.type-tile:hover{border-color:var(--brand)}
.type-tile h3{font-size:22px}
.type-tile p{margin:0;color:var(--muted);font-size:15px}
.type-tile .tag{margin-top:auto;font-size:14px;color:var(--brand);font-weight:600}
.type-tile.add{border-style:dashed;background:transparent;justify-content:center;align-items:flex-start}
.type-tile.add::before{display:none}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.section-h h2{font-size:24px}
.search{width:min(320px,100%);min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:76px 1fr auto;gap:16px;align-items:center;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item:hover{background:var(--surface-2)}
.item .thumb{width:76px;height:58px;border-radius:8px;background:var(--surface-2);object-fit:cover;border:1px solid var(--line)}
.item h3{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item p{margin:2px 0 0;color:var(--muted);font-size:14px}
.item .when{color:var(--muted);font-size:14px;text-align:right}
.badge{display:inline-block;font-size:13px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand);margin-right:6px}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:21px;margin-bottom:6px}

/* editor */
.editor{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 64px)}
.rail{border-right:1px solid var(--line);background:var(--surface);padding:14px 10px 30px;position:sticky;top:calc(64px + env(safe-area-inset-top,0px));height:calc(100vh - 64px - env(safe-area-inset-top,0px));overflow:auto}
.rail .grp{font-size:14px;color:var(--muted);padding:16px 12px 6px;font-weight:600}
.nav{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:6px 12px;border:0;border-radius:10px;background:none;text-align:left;font-size:17px}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav .dot{width:10px;height:10px;border-radius:50%;flex:none;background:transparent;border:2px solid var(--line)}
.nav .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .cnt{font-size:13px;color:var(--muted);font-weight:500}
.nav svg{width:18px;height:18px;flex:none}
.r-none{--rc:var(--ok)}.r-minor{--rc:var(--minor)}.r-moderate{--rc:var(--moderate)}.r-major{--rc:var(--major)}.r-na{--rc:var(--na)}
.nav[class*="r-"] .dot{background:var(--rc);border-color:var(--rc)}
.panel{padding:clamp(16px,3vw,32px);max-width:880px;width:100%}
.panel>h2{font-size:30px;margin-bottom:4px}
.panel>.sub{color:var(--muted);margin:0 0 22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.card h3{font-size:19px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.grid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font-size:14px;font-weight:600;color:var(--muted)}
.input,.field input,.field select,.field textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:17px}
.field textarea,textarea.input{min-height:110px;resize:vertical;line-height:1.45}
.with-mic{display:flex;gap:8px;align-items:flex-start}
.with-mic>:first-child{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:500}
.chip.on{background:var(--steel);border-color:var(--steel);color:var(--surface)}
.chip.add{border-style:dashed}
.ratings{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.rate{min-height:56px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 6px;text-align:center}
.rate .sw{width:12px;height:12px;border-radius:50%;background:var(--rc);flex:none}
.rate.on{border-color:var(--rc);background:color-mix(in srgb,var(--rc) 14%,var(--surface));color:var(--ink)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.ph{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface-2);display:flex;flex-direction:column}
.ph .img{position:relative;aspect-ratio:4/3;background:var(--line);overflow:hidden}
.ph .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .num{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;font-weight:600;border-radius:6px;padding:1px 7px}
.ph .cover-tag{position:absolute;right:8px;top:8px;background:var(--brand);color:#fff;font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px}
.ph .body{padding:10px;display:flex;flex-direction:column;gap:8px}
.ph textarea{min-height:64px;font-size:15px}
.ph .tools{display:flex;gap:6px;flex-wrap:wrap}
.ph .tools .icon-btn{width:38px;height:38px}
.add-photos{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.list-items{display:flex;flex-direction:column;gap:10px}
.li{display:grid;grid-template-columns:32px 1fr;gap:8px;align-items:start}
.li-sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.btn.rec{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn:disabled{opacity:.4;cursor:default}
.li-move{display:flex;flex-direction:column;gap:4px}
.li-move button{width:44px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0}
.li-move button svg{width:16px;height:16px}
.li-move button:disabled{opacity:.3}
.li .n{font-weight:700;color:var(--muted);padding-top:12px;text-align:right}
.li textarea{min-height:52px}
.hint{font-size:14px;color:var(--muted);margin:6px 0 0}
.room-head{display:flex;gap:10px;align-items:flex-end;margin-bottom:18px}
.room-head .field{flex:1}
.room-head input{font-family:"Barlow Semi Condensed","Barlow",sans-serif;font-size:26px;font-weight:600;background:transparent;border-color:transparent;padding-left:4px}
.room-head input:hover,.room-head input:focus{border-color:var(--line);background:var(--surface-2)}
.footer-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px}
.switch{display:flex;align-items:center;gap:10px;min-height:44px}
.switch input{width:22px;height:22px;accent-color:var(--brand)}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(15,15,18,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border-radius:16px;width:min(720px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{font-size:26px;margin-bottom:6px}
.modal .sub{color:var(--muted);margin:0 0 18px}
.modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
.toast{z-index:95!important;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--steel);color:var(--surface);padding:12px 18px;border-radius:12px;z-index:60;font-weight:500;max-width:min(560px,92vw);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.busy{position:fixed;inset:0;z-index:90;background:rgba(15,15,18,.4);display:flex;align-items:center;justify-content:center}
.busy div{background:var(--surface);padding:22px 26px;border-radius:14px;font-weight:600;display:flex;gap:12px;align-items:center}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.plan-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.plan-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.plan-bar .input{width:auto;min-height:40px;padding:6px 10px;font-size:15px}
.plan-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff;max-height:calc(100vh - 250px);-webkit-overflow-scrolling:touch}
.plan-inner{position:relative;min-width:100%}
.plan-inner>img{position:absolute;inset:0;width:100%;height:100%;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:crosshair}
.pin{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;border:0;padding:0;background:none;z-index:1}
.pin .cone{position:absolute;left:-42px;top:-42px;width:120px;height:120px;pointer-events:none;overflow:visible}
.pin .dotn{position:absolute;inset:3px;border-radius:50%;background:#8E1B1B;color:#fff;font:700 14px/26px "Barlow",Arial,sans-serif;text-align:center;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45)}
.pin.sel{z-index:2}.pin.sel .dotn{background:#1C1D20;transform:scale(1.18)}
.move-hint{background:var(--brand-soft);color:var(--brand);font-weight:600;padding:10px 14px;border-radius:10px;margin-bottom:10px}
.drawer{position:fixed;right:0;top:calc(64px + env(safe-area-inset-top,0px));bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:18;overflow:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:-12px 0 30px rgba(0,0,0,.1)}
.drawer .card{padding:14px}
.editor.has-drawer .panel{padding-right:calc(440px + 24px);max-width:none}
.dial{position:relative;width:210px;height:210px;margin:4px auto 10px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2)}
.dial button{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px}
.dial button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.dial .ctr{width:76px;height:76px;margin:-38px 0 0 -38px;font-size:13px;font-weight:600;line-height:1.1}
.pt-row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none}
.pt-row:last-child{border-bottom:0}
.pt-row .n{width:34px;height:34px;border-radius:50%;background:#8E1B1B;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.pt-row p{margin:0;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .pin-tag{position:absolute;left:8px;bottom:8px;background:#8E1B1B;color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px}
.mk{position:fixed;inset:0;z-index:55;background:#111214;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color:#fff}
.mk-bar{display:flex;gap:8px;align-items:center;padding:10px 12px;flex-wrap:wrap;background:#1D1E21;border-bottom:1px solid #303236}
.mk-bar .btn{background:#2C2D31;border-color:#3A3C40;color:#fff}
.mk-bar .btn.on{background:#fff;color:#111214;border-color:#fff}
.mk-bar .btn.primary{background:#C2312A;border-color:#C2312A}
.mk-group{display:flex;gap:6px;align-items:center;padding:0 6px;border-left:1px solid #303236}
.mk-sw{width:34px;height:34px;border-radius:50%;border:3px solid #3A3C40;padding:0}
.mk-sw.on{border-color:#fff;box-shadow:0 0 0 2px #111214 inset}
.mk-title{font-weight:600;margin-right:auto;padding:0 6px}
.mk-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px}
.mk-stage canvas{touch-action:none;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.5);cursor:crosshair}
.li-wrap{border-bottom:1px solid var(--line);padding-bottom:12px}
.li-wrap:last-child{border-bottom:0}
.li-ph{margin-left:40px}
.link-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.link-th{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:2px solid var(--line);padding:0;background:var(--line)}
.link-th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.link-th.on{border:3px solid var(--brand)}
.link-th span{position:absolute;right:4px;top:4px;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-size:13px;line-height:22px;text-align:center}
.link-th:not(.on) span{display:none}
.notes-lib{display:flex;flex-direction:column;gap:8px}
.note-chip{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:15px;line-height:1.35;min-height:44px}
.note-chip svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--brand)}
.note-chip.on{background:var(--brand-soft);border-color:var(--brand)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cat-tile{min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:17px;text-align:left;padding:12px 14px;border-left:5px solid var(--brand)}
.cat-tile:hover{background:var(--surface-2)}
.fin{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);margin-bottom:10px}
.fin:hover{border-color:var(--brand)}
.fin svg{width:26px;height:26px;flex:none;color:var(--brand);margin-top:2px}
.fin strong{display:block;font-size:18px;font-family:"Barlow Semi Condensed","Barlow",sans-serif;font-weight:600}
.fin small{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.blank-sentence{font-size:19px;line-height:2.3;margin:4px 0 6px}
.blank{display:inline-block;min-width:4.5em;max-width:100%;border:0;border-bottom:2px solid var(--brand);background:var(--brand-soft);padding:2px 8px;margin:0 2px;border-radius:6px 6px 0 0;font:inherit;font-weight:600;color:var(--ink)}
.recent{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.recent .chip{flex:none;text-align:left;line-height:1.2;padding:6px 14px}
.recent .chip small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.pin-num{width:36px;height:36px;flex:none;border-radius:50%;background:#8E1B1B;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.pin-title{flex:1;min-width:0;font-family:"Barlow Semi Condensed","Barlow",sans-serif;font-size:24px;font-weight:600;border:1px solid transparent;border-radius:10px;background:transparent;padding:4px 8px;min-height:44px}
.pin-title:hover,.pin-title:focus{border-color:var(--line);background:var(--surface-2)}
.ph .tools{gap:6px}
.tool{flex:1 1 50px;min-width:50px;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:12px;font-weight:600;padding:4px 2px;line-height:1.1}
.tool svg{width:18px;height:18px}
.tool:hover{background:var(--surface-2)}
.tool.danger{color:var(--major)}
.tool:disabled{opacity:.35}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.team-tile{text-align:left;min-height:64px;border-radius:12px;border:1px solid var(--line);border-left:5px solid var(--brand);background:var(--surface);padding:10px 14px}
.team-tile strong{display:block;font-size:17px}
.team-tile small{color:var(--muted);font-size:13px}
.team-tile.on{background:var(--brand-soft)}
.fieldrow{display:grid;grid-template-columns:1fr 170px 44px;gap:8px;margin-bottom:8px}

@media (max-width:1365px) and (min-width:901px){
  .editor.has-drawer{grid-template-columns:1fr}
  .editor.has-drawer .rail{display:none}
}
@media (max-width:900px){
  .drawer{top:auto;height:62vh;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -12px 30px rgba(0,0,0,.15)}
  .editor.has-drawer .panel{padding-right:clamp(16px,3vw,32px);padding-bottom:64vh}
}
@media (max-width:760px){
  .editor{grid-template-columns:1fr}
  .rail{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));height:auto;z-index:15;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px}
  .rail .grp{display:none}
  .nav{width:auto;flex:none;white-space:nowrap}
  .grid{grid-template-columns:1fr}
  .ratings{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bar .btn .long{display:none}
  .item{grid-template-columns:60px 1fr}
  .item .thumb{width:60px;height:48px}
  .item .when{display:none}
}
</style>
</head>

  function R(text, o = {}) {
    let pr = '';
    if (o.font) pr += `<w:rFonts w:ascii="${o.font}" w:hAnsi="${o.font}" w:cs="${o.font}"/>`;

    pr += `<w:spacing w:before="${o.before || 0}" w:after="${o.after == null ? 120 : o.after}"${o.line ? ` w:line="${o.line}" w:lineRule="auto"` : ''}/>`;

  }
  const pageBreak = () => '<w:p><w:r><w:br w:type="page"/></w:r></w:p>';

  function cell(content, o = {}) {
    let pr = `<w:tcW w:w="${o.w}" w:type="dxa"/>`;

    if (o.shade) pr += `<w:shd w:val="clear" w:color="auto" w:fill="${o.shade}"/>`;

    return `<w:tbl><w:tblPr><w:tblW w:w="${grid.reduce((a, c) => a + c, 0)}" w:type="dxa"/><w:jc w:val="${o.align || 'left'}"/>${TPL_IND != null ? `<w:tblInd w:w="${TPL_IND}" w:type="dxa"/>` : ''}<w:tblBorders>${['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map(bd).join('')}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="80" w:type="dxa"/><w:left w:w="110" w:type="dxa"/><w:bottom w:w="80" w:type="dxa"/><w:right w:w="110" w:type="dxa"/></w:tblCellMar><w:tblLook w:val="0000"/></w:tblPr><w:tblGrid>${grid.map(g => `<w:gridCol w:w="${g}"/>`).join('')}</w:tblGrid>${rows.join('')}</w:tbl>${P('', { after: 0 })}`;

  const fit = (w, h, maxW, maxH) => { w = w || 4; h = h || 3; const s = Math.min(maxW / w, maxH / h); return [Math.round(w * s), Math.round(h * s)]; };
  const fmtDate = iso => { if (!iso) return ''; const d = new Date(iso + 'T00:00:00'); if (isNaN(d)) return iso; return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' }); };
  const fmtTime = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); if (isNaN(h)) return t; const ap = h >= 12 ? 'pm' : 'am'; return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${ap}`; };
  const weatherText = d => [(d.weather || []).join(', '), d.temp ? `${d.temp} °C` : ''].filter(Boolean).join(', ');
  const fill = (txt, insp) => String(txt || '')
    .replace(/\{client\}/g, insp.details.client || 'The client')

  async function build(insp, settings, getPhotoBytes, logoBytes, JSZipLib, opts) {
    opts = opts || {};

    const hd = (text, o = {}) => useTpl

      body += P(R('Signed:') + '<w:r><w:tab/></w:r>' + R('Date:'), { tabs: [{ val: 'left', pos: 5200 }], before: 240, after: 600 });

      // ---------- summary table
      if ((insp.rooms || []).length) {
        body += P(R('Summary of Findings'), { style: 'Heading1', keepNext: true });

      // ---------- rooms
      const g = [4200, 3200, 2238];
      for (let i = 0; i < (insp.rooms || []).length; i++) {
        const rm = insp.rooms[i];
        body += P(R(rm.name), { style: 'Heading1', keepNext: true, before: i === 0 && !t.includeProperty ? 240 : 360 });
        const ri = RATING_INFO[rm.rating];
        const rows = [];
        rows.push(row([
          cell(P(R('Description:', { b: true }), { after: 0, keepNext: true }), { w: g[0] + g[1], span: 2 }),
          cell(P(ri ? R(ri.label, { b: true, sz: 26, color: ri.color }) : R('', {}), { after: 0 }), { w: g[2] })
        ], { cantSplit: true }));
        const phs = rm.photos || [];
        if (rm.notes) {

        }
        for (const ph of phs) {

            cell(P(await photo(ph, Math.round(6.9 * CM), Math.round(6.9 * CM)), { after: 0, align: 'center' }), { w: g[0], vAlign: 'center' }),
            cell(P(R(ph.caption || ''), { after: 0 }), { w: g[1] + g[2], span: 2 })
          ], { cantSplit: true }));
        }
        body += table(g, rows);
      }
      if (insp.closing) {
        body += P(R('General Comments'), { style: 'Heading1', keepNext: true, before: 360 });
        fill(insp.closing, insp).split(/\n\s*\n/).forEach(par => { body += P(R(par.trim()), { align: 'both', after: 160 }); });
      }
    } else if (useTpl) {
      // ---------- written report, laid out exactly like the SA Word template
      const tx = v => esc(v);
      const big = v => `<w:p><w:pPr><w:jc w:val="left"/><w:rPr><w:sz w:val="28"/><w:szCs w:val="28"/></w:rPr></w:pPr><w:r><w:rPr><w:sz w:val="28"/><w:szCs w:val="28"/></w:rPr><w:t xml:space="preserve">${tx(v)}</w:t></w:r></w:p>`;
      const bold = v => `<w:p><w:pPr><w:jc w:val="left"/><w:rPr><w:b/></w:rPr></w:pPr><w:r><w:rPr><w:b/></w:rPr><w:t xml:space="preserve">${tx(v)}</w:t></w:r></w:p>`;
      const plain = v => String(v == null || String(v).trim() === '' ? 'N/A' : v).split('\n').map(l => l.trim() ? `<w:p><w:r><w:t xml:space="preserve">${tx(l)}</w:t></w:r></w:p>` : '<w:p/>').join('');
      const bl = side => `<w:${side} w:val="single" w:sz="4" w:space="0" w:color="000000"/>`;

      const tc = (w, span, inner) => `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${span > 1 ? `<w:gridSpan w:val="${span}"/>` : ''}${tcB}</w:tcPr>${inner}</w:tc>`;
      const tr = (cells, h) => `<w:tr>${h ? `<w:trPr><w:trHeight w:val="${h}"/></w:trPr>` : ''}${cells}</w:tr>`;
      const pad = n => String(n).padStart(2, '0');
      const dmy = iso => { if (!iso) return ''; const [y, m, dd] = iso.split('-'); return dd && m && y ? `${pad(dd)}/${pad(m)}/${y}` : iso; };
      const hm = tm => { if (!tm) return ''; const [h, m] = tm.split(':').map(Number); if (isNaN(h)) return tm; return `${((h + 11) % 12) + 1}:${pad(m)}${h >= 12 ? 'pm' : 'am'}`; };
      const form = insp.form || {};

      const fv = key => form[key];
      const std = ['elements', 'wip', 'comments', 'other', 'next', 'checklists'];
      const listContent = key => {
        const intro = (form[key + '_intro'] || '').trim();
        const items = (Array.isArray(form[key]) ? form[key] : []).map(x => String(x).trim()).filter(Boolean);
        let x = '';
        if (intro) x += plain(intro);
        if (intro && items.length) x += '<w:p/>';
        x += items.map((it, k) => `<w:p><w:pPr><w:tabs><w:tab w:val="left" w:pos="360"/></w:tabs><w:spacing w:after="60"/><w:ind w:left="360" w:hanging="360"/></w:pPr><w:r><w:t>${k + 1}.</w:t></w:r><w:r><w:tab/></w:r><w:r><w:t xml:space="preserve">${tx(it)}</w:t></w:r></w:p>`).join('');
        return x || plain('');
      };
      const valOf = f => f.type === 'list' ? listContent(f.key) : plain(fv(f.key));
      const commentsField = fields.find(f => f.key === 'comments') || fields.find(f => f.type === 'list');
      let rows = '';
      rows += tr(tc(1823, 1, big('Project')) + tc(7811, 6, big(d.project || '')), 461);
      rows += tr(tc(1823, 1, big('Element(s) Inspected')) + tc(7811, 6, big(fv('elements') || '')));
      if (d.address) rows += tr(tc(1823, 1, bold('Address')) + tc(7811, 6, plain(d.address)));
      rows += tr(tc(1823, 1, bold('Date')) + tc(1787, 1, plain(dmy(d.date))) + tc(785, 1, bold('Time')) + tc(1701, 1, plain(hm(d.time))) + tc(1007, 2, bold('Job Number')) + tc(2531, 1, plain(d.ref || '')));
      rows += tr(tc(1823, 1, bold('Conditions')) + tc(7811, 6, plain(weatherText(d) || 'N/A')), 451);
      rows += tr(tc(1823, 1, bold('Work in progress:')) + tc(7811, 6, plain(fv('wip'))));
      rows += tr(tc(1823, 1, bold(commentsField ? commentsField.label.replace(/^comments$/i, 'Comments') : 'Comments')) + tc(7811, 6, commentsField ? valOf(commentsField) : plain('')), 2810);
      fields.filter(f => !std.includes(f.key) && f !== commentsField).forEach(f => { rows += tr(tc(1823, 1, bold(f.label)) + tc(7811, 6, valOf(f))); });
      rows += tr(tc(1823, 1, bold('Other Items')) + tc(7811, 6, plain(fv('other'))), 770);
      rows += tr(tc(1823, 1, bold('Next inspection')) + tc(2572, 2, plain(fv('next'))) + tc(2281, 2, bold('Checklists Attached')) + tc(2958, 2, plain(fv('checklists'))));
      rows += tr(tc(1823, 1, bold('Inspected by')) + tc(7811, 6, plain((d.inspector || '') + '\nOn behalf of ' + company)), 274);
      body += `<w:tbl>${opts.tblHead}${rows}</w:tbl><w:p><w:pPr><w:rPr><w:b/></w:rPr></w:pPr></w:p>`;
      body += await planBlock();
    } else {
      // ---------- written form report
      const g = [1900, 1900, 800, 1500, 1100, 2438];
      const lab = (txt, span, w) => cell(P(R(txt, { b: true }), { after: 0 }), { w, span, shade: 'F2F2F2' });
      const val = (content, span, w) => cell(typeof content === 'string' && !content.includes('<w:') ? P(R(content), { after: 0 }) : content, { w, span });
      const rest = CW - g[0];
      const rows = [];
      rows.push(row([cell(P(R('Project', { sz: 26 }), { after: 0 }), { w: g[0] }), cell(P(R(d.project || '', { sz: 26 }), { after: 0 }), { w: rest, span: 5 })], { cantSplit: true }));
      if (d.address) rows.push(row([lab('Address', 1, g[0]), val(d.address, 5, rest)], { cantSplit: true }));
      rows.push(row([
        lab('Date', 1, g[0]), val(fmtDate(d.date), 1, g[1]),
        lab('Time', 1, g[2]), val(fmtTime(d.time), 1, g[3]),
        lab('Job No.', 1, g[4]), val(d.ref || '', 1, g[5])
      ], { cantSplit: true }));
      rows.push(row([lab('Conditions', 1, g[0]), val(weatherText(d) || 'Unknown', 5, rest)], { cantSplit: true }));
      for (const f of (t.fields || [])) {

        let content;
        if (f.type === 'list') {

          const items = (Array.isArray(v) ? v : []).filter(x => String(x).trim());
          content = (intro ? P(R(intro), { after: items.length ? 160 : 0, align: 'both' }) : '') +
            items.map((it, ix) => P(R(`${ix + 1}.`) + '<w:r><w:tab/></w:r>' + R(it), { indent: 720, hanging: 360, tabs: [{ val: 'left', pos: 720 }], after: 80 })).join('');

      }
      rows.push(row([lab('Inspected by', 1, g[0]), val(P(R(d.inspector || ''), { after: 120 }) + P(R('On behalf of ' + company), { after: 0 }), 5, rest)], { cantSplit: true }));

    }

    // ---------- photo appendix (form reports, or rooms kind general photos)
    const extra = insp.photos || [];
    if (extra.length) {
      body += hd(t.kind === 'rooms' ? 'Additional Photographs' : 'Site Photographs', { pageBreakBefore: t.kind !== 'rooms', keepNext: true, before: 240 });
      const half = CW / 2;

          const img = await photo(ph, Math.round(7.9 * CM), Math.round(7.4 * CM));
          cells.push(cell(P(img, { align: 'center', after: 80 }) + P(R(`Photo ${i + j + 1}`, { b: true }) + (ph.caption ? R(': ' + ph.caption) : ''), { after: 0 }), { w: half }));
        }
        rows.push(row(cells, { cantSplit: true }));
      }
      body += table([half, half], rows);
    }

    if (useTpl) {
      const zip = await Z.loadAsync(opts.formTemplate);
      let doc = await zip.file('word/document.xml').async('string');
      const bStart = doc.indexOf('<w:body>') + 8;
      const sect = doc.slice(doc.lastIndexOf('<w:sectPr'), doc.lastIndexOf('</w:body>'));
      doc = doc.slice(0, bStart) + body + sect + '</w:body></w:document>';
      zip.file('word/document.xml', doc);
      let rels = await zip.file('word/_rels/document.xml.rels').async('string');
      rels = rels.replace('</Relationships>', docRels.join('') + '</Relationships>');
      zip.file('word/_rels/document.xml.rels', rels);
      let ctt = await zip.file('[Content_Types].xml').async('string');
      if (!/Extension="png"/i.test(ctt)) ctt = ctt.replace('<Default ', '<Default Extension="png" ContentType="image/png"/><Default ');
      zip.file('[Content_Types].xml', ctt);

      const h3 = zip.file('word/header3.xml'), f2 = zip.file('word/footer2.xml');
      if (h3) { const hx = await h3.async('string'); zip.file('word/header1.xml', hx); zip.file('word/header2.xml', hx);
        const r3 = zip.file('word/_rels/header3.xml.rels'); if (r3) { const rx = await r3.async('string'); zip.file('word/_rels/header1.xml.rels', rx); zip.file('word/_rels/header2.xml.rels', rx); } }

/* ---------------- storage (IndexedDB, falls back to memory) ---------------- */
const mem = new Map();
let dbp = null;
function idb(){
  if (dbp) return dbp;
  dbp = new Promise((res) => {
    const t = setTimeout(() => { window.__storageProblem = 'timeout'; res(null); }, 3000);
    try {
      const r = indexedDB.open('sa-inspections', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { clearTimeout(t); res(r.result); };
      r.onerror = () => { clearTimeout(t); window.__storageProblem = 'error'; res(null); };
      r.onblocked = () => { clearTimeout(t); window.__storageProblem = 'blocked'; res(null); };
    } catch (e) { clearTimeout(t); window.__storageProblem = 'unavailable'; res(null); }
  });
  return dbp;
}
async function kv(mode, fn){
  const db = await idb();
  if (!db) return null;
  return new Promise((res, rej) => {
    const t = setTimeout(() => rej(new Error('storage timeout')), 6000);
    try {
      const tx = db.transaction('kv', mode); const req = fn(tx.objectStore('kv'));
      tx.oncomplete = () => { clearTimeout(t); res(req ? req.result : undefined); }; tx.onerror = () => { clearTimeout(t); rej(tx.error); };
    } catch (e) { clearTimeout(t); rej(e); }
  });
}
const store = {
  async get(k){ try { const db = await idb(); if (!db) return mem.get(k); return await kv('readonly', s => s.get(k)); } catch(e){ return mem.get(k); } },
  async set(k,v){ try { const db = await idb(); if (!db) { mem.set(k,v); return; } await kv('readwrite', s => s.put(v,k)); } catch(e){ mem.set(k,v); toast('Couldn’t save to this device. Keep the app open until you create the report.'); } },
  async del(k){ try { const db = await idb(); if (!db) { mem.delete(k); return; } await kv('readwrite', s => s.delete(k)); } catch(e){ mem.delete(k); } },
  async keys(){ try { const db = await idb(); if (!db) return [...mem.keys()]; return await kv('readonly', s => s.getAllKeys()); } catch(e){ return [...mem.keys()]; } }
};

async function photoURL(id){
  if (urlCache.has(id)) return urlCache.get(id);
  const b = await store.get('photo:' + id); if (!b) return null;
  const u = URL.createObjectURL(b); urlCache.set(id, u); return u;

function hydrate(root = document){

function compress(file, max = 1800, q = 0.82){
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file); const im = new Image();
    im.onload = () => {
      let w = im.naturalWidth, h = im.naturalHeight; const s = Math.min(1, max / Math.max(w,h));
      w = Math.round(w*s); h = Math.round(h*s);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(im, 0, 0, w, h); URL.revokeObjectURL(u);
      c.toBlob(b => b ? res({blob:b, w, h}) : rej(new Error('encode')), 'image/jpeg', q);
    };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('That file isn’t an image this device can read.')); };
    im.src = u;
  });
}

  else if (target.kind === 'pin') { const pin = S.cur.pins.find(p => p.id === target.pinId); if (pin) { ph.pinId = pin.id; pinTargetList(pin).push(ph); } else S.cur.photos.push(ph); }
  else { S.cur.photos.push(ph); }
}
async function addFiles(files){

function loadPdfJs(){

    sc.onload = () => { const L = window.pdfjsLib; L.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(L); };

async function pdfToImage(file){
  const L = await loadPdfJs();
  const doc = await L.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
  let pageNo = 1;
  if (doc.numPages > 1) { busy(false); pageNo = await askPage(doc.numPages); if (!pageNo) return null; busy(true, 'Reading plan…'); }
  const page = await doc.getPage(pageNo);
  const v1 = page.getViewport({scale:1});
  const vp = page.getViewport({scale: Math.min(5, 2800 / Math.max(v1.width, v1.height))});
  const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  await page.render({canvasContext: ctx, viewport: vp}).promise;
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
  return {blob, w: c.width, h: c.height, page: pageNo, pages: doc.numPages};
}

async function renderPlanImage(insp, pl, pins){

  const im = await loadImg(blob);
  const c = document.createElement('canvas'); c.width = pl.w; c.height = pl.h; const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(im, 0, 0, c.width, c.height);

    const x = p.x * c.width, y = p.y * c.height;
    if (p.dir != null) { const a = (p.dir - 90) * Math.PI / 180; ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, L, a - half, a + half); ctx.closePath(); ctx.fillStyle = 'rgba(142,27,27,0.3)'; ctx.fill(); ctx.lineWidth = 2 * s; ctx.strokeStyle = '#8E1B1B'; ctx.stroke(); }

    ctx.fillStyle = '#fff'; ctx.font = `700 ${17 * s}px Arial, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(p.n), x, y + 0.5 * s);
  });
  return await new Promise(res => c.toBlob(res, 'image/jpeg', 0.88));
}
async function prepareReport(src){
  const i = clone(src); const tmp = new Map();
  if (i.tpl.kind !== 'rooms') i.tpl.reportTitle = reportTitleOf(i);
  if (i.tpl.kind !== 'rooms' && isPhotoInsp(i)) {
    if (!(i.details.weather || []).length && !i.details.temp) i.details.weather = ['Unknown'];
    if (!String(i.form.wip || '').trim()) i.form.wip = 'Unknown';
  }
  if (i.tpl.kind !== 'rooms') {
    const repPhotos = [];
    (i.tpl.fields || []).filter(f => f.type === 'list').forEach(f => {
      const items = Array.isArray(i.form[f.key]) ? i.form[f.key] : []; const phs = i.form[f.key + '_ph'] || []; let n = 0;
      i.form[f.key] = items.map((txt, k) => {
        const t = String(txt || '').trim(); if (t) n++;
        const list = phs[k] || []; if (!list.length) return txt;
        const nums = list.map(ph => { repPhotos.push({...ph, caption: (t ? `Comment ${n}: ` : '') + (ph.caption && ph.caption !== 'Sketch' ? ph.caption : t)}); return repPhotos.length; });
        return t ? `${t} (refer Photo${nums.length > 1 ? 's' : ''} ${nums.join(', ')})` : txt;
      });
    });
    i.photos = repPhotos;
  }
  i.pins = i.pins || []; i.plans = i.plans || [];
  const byId = Object.fromEntries(i.pins.map(p => [p.id, p]));
  const lookTxt = p => { const b = bearing(i, p); return b ? COMPASS_LONG[b] : ''; };
  [...i.rooms.flatMap(r => r.photos), ...i.photos].forEach(ph => {
    const p = ph.pinId && byId[ph.pinId]; if (!p) return;
    const l = lookTxt(p); ph.caption = `${pinTitle(p)}${l ? ', looking ' + l : ''}${ph.caption ? ': ' + ph.caption : ''}`;
  });
  const sorted = i.pins.slice().sort((a, b) => a.n - b.n);
  sorted.forEach(p => { if (!(p.notes || '').trim()) return; const r = i.rooms.find(x => x.id === p.roomId); if (!r) return; const l = lookTxt(p); r.notes = (r.notes ? r.notes.trim() + '\n' : '') + `${pinTitle(p)}${l ? ' (looking ' + l + ')' : ''}: ${p.notes.trim()}`; });
  i.planSection = [];
  // Construction reports only show photos attached to comments: no plan page, point list or point photos.
  if (i.tpl.kind !== 'rooms') { i.pinKey = []; return {i, tmp}; }
  for (const pl of i.plans) {
    const blob = await renderPlanImage(i, pl, i.pins.filter(p => p.planId === pl.id)); if (!blob) continue;
    const id = 'tmp:' + pl.id; tmp.set(id, blob); i.planSection.push({id, w:pl.w, h:pl.h, title:pl.name});
  }
  i.pinKey = sorted.map(p => { const r = i.rooms.find(x => x.id === p.roomId); const pl = i.plans.find(x => x.id === p.planId);
    return { n:p.n, where: [pinLabel(p), r ? r.name : '', i.plans.length > 1 && pl ? pl.name : ''].filter(Boolean).join(', '), look: lookTxt(p), notes: r ? (p.notes ? 'See ' + r.name : '') : (p.notes || '') }; });
  return {i, tmp};
}

function sketchCanvas(){
  const c = document.createElement('canvas'); c.width = 1600; c.height = 1200; const x = c.getContext('2d');

}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recBtn = null;
function stopDictation(){ if (rec) { try { rec.stop(); } catch(e){} } }
function toggleDictation(btn){
  const ta = document.getElementById(btn.dataset.for);
  if (!ta) return;
  if (rec && recBtn === btn) { stopDictation(); return; }
  stopDictation();
  if (!SR) { ta.focus(); toast('Tap the microphone key on the iPad keyboard to dictate into this box.'); return; }
  const r = new SR(); rec = r; recBtn = btn;
  r.lang = 'en-AU'; r.continuous = true; r.interimResults = true;
  const base = ta.value ? ta.value.replace(/\s+$/,'') + (/[.!?]$/.test(ta.value.trim()) ? ' ' : (ta.value.trim() ? '. ' : '')) : '';
  let finalText = '';
  r.onresult = ev => {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const t = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) finalText += t; else interim += t;
    }
    let txt = (finalText + interim).trim();
    if (txt && !base) txt = txt.charAt(0).toUpperCase() + txt.slice(1);
    ta.value = base + txt;
    ta.dispatchEvent(new Event('input', {bubbles:true}));
  };
  r.onerror = ev => {
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') { ta.focus(); toast('Voice input isn’t allowed here. Tap the microphone key on the iPad keyboard instead.'); }
    else if (ev.error !== 'no-speech' && ev.error !== 'aborted') toast('Dictation stopped: ' + ev.error);
  };
  r.onend = () => { btn.classList.remove('rec'); btn.setAttribute('aria-pressed','false'); if (rec === r) { rec = null; recBtn = null; } };
  try { r.start(); btn.classList.add('rec'); btn.setAttribute('aria-pressed','true'); toast('Listening… tap the microphone again to stop.'); }
  catch (e) { ta.focus(); toast('Tap the microphone key on the iPad keyboard to dictate.'); }
}

function photoCard(ph, path, ix, o){

function photoGrid(list, path, allowCover){

  return `<div class="photos">${list.map((ph, ix) => photoCard(ph, path, ix, {num:ix + 1, len:list.length, allowCover})).join('')}</div>`;
}

function b64ToBytes(b){ const s = atob(b); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
async function buildWordBlob(i){
  const prep = await prepareReport(i);
  let opts = {};
  if (i.tpl.kind !== 'rooms') {
    const tplBytes = b64ToBytes(FORM_TPL_B64);
    const tz = await JSZip.loadAsync(tplBytes); const dx = await tz.file('word/document.xml').async('string');
    const m = dx.match(/<w:tblPr>[\s\S]*?<\/w:tblGrid>/);
    const tb = side => `<w:${side} w:val="single" w:sz="4" w:space="0" w:color="000000"/>`;
    if (m) opts = {formTemplate: tplBytes, tblHead: m[0].replace('<w:tblLook', `<w:tblBorders>${['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map(tb).join('')}</w:tblBorders><w:tblLook`)};
  }
  const zip = await SADocx.build(prep.i, S.settings, async id => { const b = prep.tmp.get(id) || await store.get('photo:' + id); return b ? new Uint8Array(await b.arrayBuffer()) : null; }, b64ToBytes(LOGO_B64), undefined, opts);
  Object.keys(zip.files).forEach(k => { if (zip.files[k].dir) delete zip.files[k]; });
  return zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
async function createReport(){
  const i = S.cur; stopDictation();
  if (i.tpl.kind === 'rooms' && !i.details.address) { S.panel = 'details'; renderEditor(); toast('Add the property address first.'); $('#f_details_address') && $('#f_details_address').focus(); return; }
  if (i.tpl.kind === 'form' && !i.details.project) { S.panel = 'details'; renderEditor(); toast('Add the project name first.'); $('#f_details_project') && $('#f_details_project').focus(); return; }
  if (typeof JSZip === 'undefined') { toast('The report builder didn’t load. Check the internet connection and reopen the app.'); return; }
  busy(true, 'Building Word report…');
  let blob;
  try { blob = await buildWordBlob(i); } catch (e) { busy(false); toast('Couldn’t build the report: ' + (e.message || e)); return; }
  busy(false);
  const name = [i.details.ref, i.details.address || i.details.project, reportTitleOf(i)].filter(Boolean).join(' - ').replace(/[\\/:*?"<>|]+/g, '-').slice(0, 150) + '.docx';
  const sizeMB = (blob.size / 1048576).toFixed(1);
  modal(`<h2>Report ready</h2><p class="sub">${esc(name)}, ${sizeMB} MB. It opens in Word, Pages or Google Docs and every part of it can be edited.</p>
    <div class="acts"><button class="btn" data-x="close">Close</button><button class="btn primary" data-x="save">${I.word}Save Word file</button></div>`, s => {
    s.querySelector('[data-x=close]').onclick = closeModal;
    s.querySelector('[data-x=save]').onclick = () => saveFile(name, blob);
  });
}
async function saveFile(name, blob){
  if (!downloadsNS && window.claude && window.claude.use) { try { downloadsNS = await window.claude.use('downloads'); } catch(e){} }
  if (downloadsNS) {
    try { await downloadsNS.save({filename: name, data: blob}); closeModal(); toast('Saved.'); }
    catch (e) {
      if (e && e.code === 'declined') return;
      if (e && e.code === 'rate_limited') { toast('A save is already waiting for your answer.'); return; }
      fallbackSave(name, blob);
    }
    return;
  }
  fallbackSave(name, blob);
}
function fallbackSave(name, blob){
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); closeModal(); toast('Saved.'); }
  catch (e) { toast('Saving files isn’t available in this view. Open the app from its own link.'); }
}

let jspdfP = null;
function loadJsPdf(){
  if (jspdfP) return jspdfP;
  jspdfP = new Promise((res, rej) => {
    if (window.jspdf && window.jspdf.jsPDF) return res(window.jspdf.jsPDF);
    const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    sc.onload = () => res(window.jspdf.jsPDF);
    sc.onerror = () => { jspdfP = null; rej(new Error('Couldn’t load the PDF maker. Check the internet connection.')); };
    document.head.appendChild(sc);
  });
  return jspdfP;
}
async function buildFormPdf(insp, getBytes){
  const JsPDF = await loadJsPdf();
  const doc = new JsPDF({unit:'mm', format:'a4', compress:true});
  const t = insp.tpl, d = insp.details, form = insp.form || {}, st = S.settings;
  const RED = [150, 22, 22], X0 = 17.8, TW = 169.9, TOP = 29, BOTTOM = 276, PAD = 1.9;
  const mm = tw => tw * TW / 9634;
  const LH = sz => sz * 0.3528 * 1.2;
  const pad2 = n => String(n).padStart(2, '0');
  const dmy = iso => { if (!iso) return ''; const [yy, m, dd] = iso.split('-'); return dd ? `${pad2(dd)}/${pad2(m)}/${yy}` : iso; };
  const hm = tm => { if (!tm) return ''; const [h, m] = tm.split(':').map(Number); return isNaN(h) ? tm : `${((h + 11) % 12) + 1}:${pad2(m)}${h >= 12 ? 'pm' : 'am'}`; };
  const NA = v => (v == null || String(v).trim() === '') ? 'N/A' : String(v);
  const para = (text, o = {}) => Object.assign({text: String(text == null ? '' : text)}, o);
  const lines = (v, o = {}) => NA(v).split('\n').map(l => l.trim() ? para(l, o) : {blank:true});
  const B = txt => para(txt, {bold:true});
  const C = (tw, paras) => ({tw, paras});
  let y = TOP;
  const layout = c => {
    const out = []; let h = 1.4;
    for (const pr of c.paras) {
      const sz = pr.size || 9;
      if (pr.blank) { h += LH(sz) * 0.8; continue; }
      doc.setFont('helvetica', pr.bold ? 'bold' : 'normal'); doc.setFontSize(sz);
      const ind = pr.indent || 0;
      doc.splitTextToSize(pr.text, c.w - 2 * PAD - ind).forEach((ln, k) => { out.push({ln, dy:h, sz, bold:pr.bold, x:c.x + PAD + ind, lead: k === 0 ? pr.lead : null, lx:c.x + PAD}); h += LH(sz); });
      h += pr.after || 0;
    }
    return {out, h: h + 1.2};
  };
  const drawRow = (cells, minTw) => {

/* ---------------- quick fill: blanks, recent jobs, auto wording ---------------- */
const MULTI_KEYS = ['elements', 'wip'];
function fillStarter(t, el){
  const e = el.charAt(0).toLowerCase() + el.slice(1);
  const plural = /,| and | & /.test(e) || /s$/i.test(e.trim());
  let out = t.replace('{element}', e);
  if (plural) out = out.replace(' appears ', ' appear ').replace(' generally appears ', ' generally appear ').replace(' has been found ', ' have been found ').replace(' is in conformance', ' are in conformance');
  return out;
}
function joinParts(a){ const p = a.map((x, j) => j && /^[A-Z][a-z]/.test(x) ? x.charAt(0).toLowerCase() + x.slice(1) : x); return p.length <= 1 ? (p[0] || '') : p.slice(0, -1).join(', ') + ' and ' + p[p.length - 1]; }
function syncSel(i, k){ const cur = String(i.form[k] || '').trim(); let sel = Array.isArray(i.form[k + '_sel']) ? i.form[k + '_sel'].slice() : []; if (joinParts(sel) !== cur) sel = cur ? [cur] : []; return sel; }
function sugOn(i, k, v){ const pat = notePattern(v); if (!MULTI_KEYS.includes(k)) return pat.test(String(i.form[k] || '').trim()); return syncSel(i, k).some(x => pat.test(x)); }
function notePattern(t){ return new RegExp('^' + String(t).split(/\[[^\]]*\]/).map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('[\\s\\S]+?') + '$'); }
function fillBlanks(text, title){
  const parts = String(text).split(/(\[[^\]]*\])/);
  if (parts.length === 1) return Promise.resolve(text);
  const isB = p => /^\[[^\]]*\]$/.test(p);
  const pad = n => String(n).padStart(2, '0'); const dt = new Date(); const today = `${pad(dt.getDate())}/${pad(dt.getMonth() + 1)}/${dt.getFullYear()}`;
  return new Promise(res => {
    let k = 0;
    const html = parts.map(p => {
      if (!isB(p)) return esc(p);
      const inner = p.slice(1, -1).trim();
      const hint = !inner || /^(number|numbers|location|units|name|level)$/i.test(inner);
      const val = /^date$/i.test(inner) ? today : hint ? '' : inner;
      return `<input class="blank" data-b="${k++}" value="${esc(val)}" placeholder="${esc(inner || '…')}" size="${Math.max(5, (val || inner).length + 1)}" autocomplete="off" aria-label="${esc(inner || 'blank')}">`;
    }).join('');
    modal(`<h2>${esc(title || 'Fill in the blanks')}</h2><p class="sub">Change the highlighted parts, then tap Add.</p><div class="blank-sentence">${html}</div>
      <div class="acts"><button class="btn" data-x="no">Cancel</button><button class="btn primary" data-x="yes">${I.check}Add</button></div>`, s => {
      const inputs = [...s.querySelectorAll('.blank')];
      const first = inputs.find(x => !x.value) || inputs[0]; first.focus(); first.select && first.select();
      inputs.forEach(x => x.addEventListener('input', () => { x.size = Math.max(5, x.value.length + 1); }));
      const done = () => { let j = 0; const out = parts.map(p => { if (!isB(p)) return p; const v = inputs[j++].value.trim(); return v || p; }).join(''); closeModal(); res(out); };
      s.querySelector('[data-x=no]').onclick = () => { closeModal(); res(null); };
      s.querySelector('[data-x=yes]').onclick = done;
      s.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); const ix = inputs.indexOf(e.target); if (ix >= 0 && ix < inputs.length - 1) inputs[ix + 1].focus(); else done(); } });
    });
  });
}
function recentJobs(){
  const seen = new Set(), out = [];
  for (const x of S.list) {
    if (S.cur && x.id === S.cur.id) continue;
    const d = x.details || {}; if (!d.project && !d.ref) continue;
    const key = (d.project || '').trim().toLowerCase() + '|' + (d.ref || '').trim();
    if (seen.has(key)) continue; seen.add(key); out.push(x); if (out.length >= 8) break;
  }
  return out;
}

function listKey(i){ const f = (i.tpl.fields || []).find(f => f.key === 'comments') || (i.tpl.fields || []).find(f => f.type === 'list'); return f ? f.key : null; }
function autoIntro(i){

/* ---------------- automatic sending (Netlify + Resend + Dropbox) ---------------- */
const AUTO = {status:null};
const autoHeaders = () => ({'x-sa-passcode': S.settings.passcode || ''});
async function autoStatus(force){
  if (AUTO.status && !force) return AUTO.status;
  if (!/^https?:$/.test(location.protocol)) return (AUTO.status = {ok:false});
  try {
    const r = await fetch('/.netlify/functions/sa-status', {headers: autoHeaders(), cache:'no-store'});
    AUTO.status = r.ok && /json/.test(r.headers.get('content-type') || '') ? await r.json() : {ok:false};
  } catch (_) { AUTO.status = {ok:false}; }
  return AUTO.status;
}
async function errText(r){ try { const j = await r.json(); return j.error || r.statusText; } catch (_) { return 'Server error ' + r.status; } }
async function autoUploadLinks(folder, sub, names){
  const r = await fetch('/.netlify/functions/sa-upload-links', {method:'POST', headers:{...autoHeaders(), 'content-type':'application/json'}, body: JSON.stringify({folder, sub, names})});
  if (!r.ok) throw new Error(await errText(r));
  return r.json();
}
async function autoSend(i, o, to, cc, subject, body, progress){
  const d = i.details, c = contactOf(i);
  const files = [];
  if (o.autoFiles.report) files.push({file:o.autoFiles.report, client:true, inspector:true});
  if (o.autoFiles.report) { progress('Making the Word copy…'); const w = await buildWordBlob(i); files.push({file:new File([w], reportFileBase(i) + '.docx', {type:w.type}), inspector:true}); }
  if (o.autoFiles.zip) files.push({file:o.autoFiles.zip, client:true, inspector:true, zip:true});
  const folder = [d.ref, d.project || d.address].filter(Boolean).join(' ') || 'Inspections';
  const now = new Date(), pad = n => String(n).padStart(2, '0');
  const sub = `${d.date || now.toISOString().slice(0, 10)} ${pad(now.getHours())}${pad(now.getMinutes())} ${reportTitleOf(i)}`;
  progress('Preparing Dropbox…');
  const up = await autoUploadLinks(folder, sub, files.map(f => f.file.name));
  let direct = true;
  const MAX_PROXY = 5.5 * 1048576;
  const uploadOne = async (file, item) => {
    if (direct && item.link) {
      try { const u = await fetch(item.link, {method:'POST', headers:{'content-type':'application/octet-stream'}, body:file}); if (u.ok) return; } catch (_) {}
      direct = false;
    }
    if (file.size > MAX_PROXY) return 'too-big';
    const u = await fetch('/.netlify/functions/sa-upload', {method:'POST', headers:{...autoHeaders(), 'x-sa-path': encodeURIComponent(item.path), 'content-type':'application/octet-stream'}, body:file});
    if (!u.ok) throw new Error(await errText(u));
  };
  const extra = [];
  for (let k = 0; k < files.length; k++) {
    progress(`Uploading to Dropbox, ${k + 1} of ${files.length}…`);
    files[k].path = up.items[k].path;
    const res = await uploadOne(files[k].file, up.items[k]);
    if (res === 'too-big') {
      if (!files[k].zip || !o.autoFiles.photos) throw new Error(`${files[k].file.name} is too large to upload from this device.`);
      files[k].skip = true;
      const ups = await autoUploadLinks(folder, sub + '/Photos', o.autoFiles.photos.map(f => f.name));
      for (let q = 0; q < o.autoFiles.photos.length; q++) {
        progress(`Uploading photos, ${q + 1} of ${o.autoFiles.photos.length}…`);
        const r2 = await uploadOne(o.autoFiles.photos[q], ups.items[q]);
        if (r2 === 'too-big') throw new Error(`${o.autoFiles.photos[q].name} is too large to upload.`);
        extra.push({path: ups.items[q].path, name: o.autoFiles.photos[q].name});
      }
    }
  }
  progress('Sending the emails…');
  const clientFiles = files.filter(f => f.client && !f.skip).map(f => ({path:f.path, name:f.file.name})).concat(extra);
  const inspFiles = files.filter(f => f.inspector && !f.skip).map(f => ({path:f.path, name:f.file.name})).concat(extra);
  const first = (c.name || '').split(' ')[0];
  const adminMail = (S.settings.adminEmail || 'admin@structuralarts.com.au').trim();
  const wordTo = [...new Set([c.email, adminMail].map(x => String(x || '').trim().toLowerCase()).filter(Boolean))];
  const payload = {
    to, cc, subject, text: body, replyTo: c.email || '', clientFiles,
    inspector: o.autoFiles.report && wordTo.length ? {
      to: wordTo, files: inspFiles, subject: 'Word copy - ' + subject,
      text: `Hi ${wordTo.length > 1 ? 'all' : (first || 'there')},\n\nThe report "${subject}" was sent to ${to.join(', ') || cc.join(', ')}${to.length && cc.length ? ' (copy to ' + cc.join(', ') + ')' : ''}.\n\nThe editable Word copy, the PDF${o.autoFiles.zip ? ' and the photos' : ''} are attached, and are also saved in Dropbox:\n${up.folder}\n\nSent automatically by the SA Inspections app.`
    } : null
  };
  const r = await fetch('/.netlify/functions/sa-send', {method:'POST', headers:{...autoHeaders(), 'content-type':'application/json'}, body: JSON.stringify(payload)});
  if (!r.ok) throw new Error(await errText(r));
  await r.json();
  return {folder: up.folder, wordTo: payload.inspector ? wordTo : []};
}
async function refreshAutoState(){
  const el = $('#autoState'); if (!el) return;
  el.textContent = 'Checking…';
  const st = await autoStatus(true);
  if (!$('#autoState')) return;
  el.textContent = st.ok ? `Connected. Reports are emailed from ${st.from} and saved to Dropbox in ${st.root}.`

async function backup(){
  busy(true, 'Preparing backup…');
  const photos = {};
  for (const i of S.list) {
    const ids = allPhotoIds(i);
    for (const id of ids) { const b = await store.get('photo:' + id); if (b) photos[id] = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); }
  }
  const data = JSON.stringify({app:'sa-inspections', version:1, savedAt:new Date().toISOString(), settings:S.settings, templates:S.templates, library:S.library, inspections:S.list, photos});
  busy(false);
  saveFile(`SA inspections backup ${todayISO()}.json`, new Blob([data], {type:'application/json'}));
}
$('#pickJson').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  busy(true, 'Adding inspections…');
  try {
    const d = JSON.parse(await f.text()); if (d.app !== 'sa-inspections') throw new Error('This isn’t an SA inspections backup file.');
    for (const [id, url] of Object.entries(d.photos || {})) { if (await store.get('photo:' + id)) continue; const b = await (await fetch(url)).blob(); await store.set('photo:' + id, b); }
    let added = 0, updated = 0, kept = 0;
    for (const i of d.inspections || []) {
      const ex = await store.get('insp:' + i.id);
      if (ex && (ex.updatedAt || 0) >= (i.updatedAt || 0)) { kept++; continue; }
      await store.set('insp:' + i.id, i); ex ? updated++ : added++;
    }
    if (d.templates) { const have = new Set(S.templates.map(t => t.id)); d.templates.forEach(t => { if (!have.has(t.id)) S.templates.push(t); }); await store.set('templates', S.templates); }
    if (d.library) { const have = new Set(S.library.map(c => c.id)); d.library.forEach(c => { if (!have.has(c.id)) S.library.push(c); }); await store.set('library', S.library); }
    await loadAll(); busy(false);
    toast([added ? `${added} new inspection${added === 1 ? '' : 's'} added` : '', updated ? `${updated} updated` : '', kept ? `${kept} already up to date` : ''].filter(Boolean).join(', ') + '. Your own inspections are unchanged.');
    renderHome();
  } catch (err) { busy(false); toast(err.message || 'Couldn’t read that backup file.'); }
});

      if (i.tpl.kind === 'rooms' && !d.accessBy && sd.accessBy && src.tpl.kind === 'rooms') {}
      saveCur(); S.keepScroll = true; renderEditor(); toast(`Filled in from ${sd.project || 'that job'}.`); break; }
    case 'phrase': { const r = i.rooms.find(x => 'room:' + x.id === S.panel); if (!r) return; const f = await fillBlanks(b.dataset.v, 'Add observation'); if (f == null) return;
      r.notes = (String(r.notes || '').trim() ? String(r.notes).trim() + '\n' : '') + f;
      if (/^No defects observed/i.test(f) && !r.rating) r.rating = 'none';
      saveCur(); S.keepScroll = true; renderEditor(); break; }
    case 'note': { const k = b.dataset.k, v = b.dataset.v; const items = i.form[k] = Array.isArray(i.form[k]) ? i.form[k] : []; const pa = i.form[k + '_ph'] = i.form[k + '_ph'] || []; while (pa.length < items.length) pa.push([]);
      const pat = notePattern(v); const ix = items.findIndex(x => pat.test(String(x).trim()));
      if (ix >= 0) { if ((pa[ix] || []).length) { toast('That item has photos. Remove it with its bin button if you’re sure.'); return; } items.splice(ix, 1); pa.splice(ix, 1); }
      else { const f = await fillBlanks(v, 'Fill in the blanks'); if (f == null) return; const empty = items.findIndex(x => !String(x).trim()); if (empty >= 0) items[empty] = f; else { items.push(f); pa.push([]); } }
      saveCur(); S.keepScroll = true; renderEditor(); break; }
    case 'editlib': openLibEditor(b.dataset.id); break;
    case 'resetlib': { if (!(await confirmBox('Restore the standard notes?', 'Missing standard categories and notes are added back. Your own categories and edits are kept.', 'Restore'))) return; mergeDefaultLibrary(); await store.set('library', S.library); renderSettings(); toast('Standard notes restored.'); break; }
    case 'zip-photos': saveCur(true); sendPhotos(); break;
    case 'pin-label': { const pin = i.pins.find(p => p.id === S.pinSel); if (!pin) return; pin.label = pinLabel(pin) === b.dataset.v ? '' : b.dataset.v; saveCur(); S.keepScroll = true; S.keepDrawer = true; renderEditor(); break; }
    case 'pin-rate': { const pin = i.pins.find(p => p.id === S.pinSel); const rm = pin && i.rooms.find(r => r.id === pin.roomId); if (!rm) return; rm.rating = rm.rating === b.dataset.k ? null : b.dataset.k; saveCur(); S.keepScroll = true; S.keepDrawer = true; renderEditor(); break; }
    case 'pin-link': { const pin = i.pins.find(p => p.id === S.pinSel); const rm = pin && i.rooms.find(r => r.id === pin.roomId); if (!rm) return; const ph = rm.photos[+b.dataset.i]; if (ph.pinId === pin.id) delete ph.pinId; else ph.pinId = pin.id; saveCur(); S.keepScroll = true; S.keepDrawer = true; renderEditor(); break; }
    case 'mic': toggleDictation(b); break;
    case 'weather': { const w = b.dataset.w, arr = i.details.weather; const k = arr.indexOf(w); k >= 0 ? arr.splice(k,1) : arr.push(w); b.classList.toggle('on'); b.setAttribute('aria-pressed', k < 0); saveCur(); break; }
    case 'prop': { const arr = i.property[b.dataset.g] = i.property[b.dataset.g] || []; const k = arr.indexOf(b.dataset.o); k >= 0 ? arr.splice(k,1) : arr.push(b.dataset.o); b.classList.toggle('on'); b.setAttribute('aria-pressed', k < 0); saveCur(); break; }
    case 'addroom': case 'addroom-custom': {
      let n = a === 'addroom' ? b.dataset.n : ($('#customRoom').value || '').trim();
      if (!n) { toast('Type a name for the room first.'); return; }
      const same = i.rooms.filter(r => r.name === n || r.name.startsWith(n + ' ')).length;
      if (n === 'Bedroom') n = 'Bedroom ' + (same + 1); else if (same) n = n + ' ' + (same + 1);
      const r = {id:uid(), name:n, rating:null, notes:'', photos:[]}; i.rooms.push(r); S.lastRoomId = r.id; S.panel = 'room:' + r.id; saveCur(true); renderEditor(); break;
    }
    case 'rate': { const r = i.rooms.find(x => 'room:' + x.id === S.panel); r.rating = r.rating === b.dataset.k ? null : b.dataset.k; saveCur(); S.keepScroll = true; renderEditor(); break; }
    case 'room-move': { const ix = i.rooms.findIndex(x => 'room:' + x.id === S.panel), d = +b.dataset.d; const [r] = i.rooms.splice(ix,1); i.rooms.splice(ix + d, 0, r); saveCur(); S.keepScroll = true; renderEditor(); break; }
    case 'room-del': { const r = i.rooms.find(x => 'room:' + x.id === S.panel); if (await confirmBox(`Remove ${r.name}?`, `Its ${r.photos.length} photos and notes will be deleted from this inspection.`, 'Remove room')) { i.rooms = i.rooms.filter(x => x !== r); r.photos.forEach(p => store.del('photo:' + p.id)); i.pins.forEach(p => { if (p.roomId === r.id) p.roomId = null; }); S.panel = i.rooms.length ? 'room:' + i.rooms[i.rooms.length-1].id : 'addroom'; saveCur(true); renderEditor(); } break; }
    case 'pick': photoTarget = JSON.parse(b.dataset.target); $(b.dataset.src === 'cam' ? '#pickCam' : '#pickLib').click(); break;
    case 'cover-pick': photoTarget = {kind:'cover'}; $(b.dataset.src === 'cam' ? '#pickCam' : '#pickLib').click(); break;
    case 'cover-del': i.coverPhoto = null; saveCur(); renderEditor(); break;
    case 'ph-move': { const list = getPath(i, b.dataset.path), ix = +b.dataset.i, d = +b.dataset.d; const [p] = list.splice(ix,1); list.splice(ix + d, 0, p); saveCur(); S.keepScroll = true; renderEditor(); break; }
    case 'ph-cover': { const p = getPath(i, b.dataset.path)[+b.dataset.i]; i.coverPhoto = {id:p.id, w:p.w, h:p.h, caption:''}; saveCur(); S.keepScroll = true; renderEditor(); toast('Set as the cover photo.'); break; }
    case 'ph-del': { if (!(await confirmBox('Delete this photo?', 'It will be removed from the inspection.', 'Delete photo'))) return; const list = getPath(i, b.dataset.path); const [p] = list.splice(+b.dataset.i, 1); const stillUsed = i.coverPhoto && i.coverPhoto.id === p.id; if (!stillUsed) store.del('photo:' + p.id); if (p.orig && !(i.coverPhoto && i.coverPhoto.id === p.orig)) store.del('photo:' + p.orig); saveCur(); S.keepScroll = true; renderEditor(); break; }
    case 'li-add': { i.form[b.dataset.k].push(''); const pa = i.form[b.dataset.k + '_ph'] = i.form[b.dataset.k + '_ph'] || []; while (pa.length < i.form[b.dataset.k].length) pa.push([]); saveCur(); S.keepScroll = true; renderEditor(); const items = document.querySelectorAll(`[id^="li_${b.dataset.k}_"]`); items.length && items[items.length-1].focus(); break; }
    case 'li-move': { const k = b.dataset.k, ix = +b.dataset.i, j = ix + (+b.dataset.d); const items = i.form[k] || []; if (j < 0 || j >= items.length) return;
      const pa = i.form[k + '_ph'] = i.form[k + '_ph'] || []; while (pa.length < items.length) pa.push([]);
      [items[ix], items[j]] = [items[j], items[ix]]; [pa[ix], pa[j]] = [pa[j], pa[ix]];
      saveCur(); S.keepScroll = true; renderEditor(); break; }
    case 'li-del': { const k = b.dataset.k, ix = +b.dataset.i; const pa = i.form[k + '_ph'] || []; const gone = pa[ix] || [];
      if (gone.length && !(await confirmBox(`Remove item ${ix + 1}?`, `Its ${gone.length} photo${gone.length === 1 ? '' : 's'} will be deleted too.`, 'Remove item'))) return;
      i.form[k].splice(ix, 1); pa.splice(ix, 1); gone.forEach(ph => { store.del('photo:' + ph.id); if (ph.orig) store.del('photo:' + ph.orig); }); saveCur(); S.keepScroll = true; renderEditor(); break; }
    case 'starter': { const el = (i.form.elements || '').trim() || 'works'; const t0 = fillStarter(COMMENT_STARTERS[+b.dataset.i], el); const txt = await fillBlanks(t0, 'Opening sentence'); if (txt == null) return; i.form[b.dataset.k + '_intro'] = txt; i.form.introAuto = false;
      if (+b.dataset.i === 1 || +b.dataset.i === 2) i.form.method = 'photos'; else if (+b.dataset.i === 0) i.form.method = 'site'; saveCur(); S.keepScroll = true; renderEditor(); break; }
    case 'del-insp': {
      if (!(await confirmBox('Delete this inspection?', 'All its notes and photos will be removed from this iPad. Reports you already saved aren’t affected.', 'Delete inspection'))) return;
      const ids = allPhotoIds(i);
      ids.forEach(id => store.del('photo:' + id)); await store.del('insp:' + i.id); S.cur = null; await loadAll(); renderHome(); toast('Inspection deleted.'); break;
    }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#scrim')) closeModal(); else if (S.pinSel) { cleanupPin(); S.keepScroll = true; renderEditor(); } } if (e.key === 'Enter' && e.target.id === 'customRoom') { e.preventDefault(); $('[data-act="addroom-custom"]').click(); } });
document.addEventListener('visibilitychange', () => { if (document.hidden) saveCur(true); });

/* ---------------- start ---------------- */
function showFatal(msg){
  const box = document.getElementById('fatal') || document.body.appendChild(Object.assign(document.createElement('div'), {id:'fatal'}));
  box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:99;background:#B3261E;color:#fff;padding:14px 16px;border-radius:12px;font:500 15px/1.4 system-ui,sans-serif';
  box.textContent = 'Something went wrong: ' + msg + '. Take a screenshot of this and send it to Claude.';
}
window.addEventListener('error', e => showFatal((e.message || 'error') + (e.lineno ? ' (line ' + e.lineno + ')' : '')));
window.addEventListener('unhandledrejection', e => showFatal(String((e.reason && e.reason.message) || e.reason || 'error')));
(async () => {
  $('#app').innerHTML = `<div class="busy" style="position:static;background:none;height:60vh"><div><span class="spin"></span>Loading inspections…</div></div>`;
  try { await Promise.race([loadAll(), new Promise(r => setTimeout(r, 8000))]); } catch (e) { showFatal(e.message || String(e)); }
  renderHome();
  if (window.__storageProblem) toast('This view can’t save to the iPad (' + window.__storageProblem + '). Work will be lost when you close it, so open the link in Safari instead.');
})();
</script>
